name: Build Test

on:
  push:
    paths:
      - "app/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - "next.config.ts"
      - "tsconfig.json"
  pull_request:
    paths:
      - "app/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - "next.config.ts"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key
      # createAdminSupabaseClient() は未設定時に throw する。ビルド時の /demo 静的生成で
      # 落ちないよう placeholder を置く（実API呼び出しは失敗し空表示になる）
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
