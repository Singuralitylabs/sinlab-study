name: Biome Check

on:
  push:
    paths:
      - "app/**"
      - "scripts/**"
      - "biome.json"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "biome.json"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
  workflow_call:
  workflow_dispatch:

jobs:
  biome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome check
        run: bunx biome check .
